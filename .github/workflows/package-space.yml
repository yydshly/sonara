name: Package a workspace
on:
  workflow_dispatch:
    inputs:
      target:
        description: Workspace entry point
        type: choice
        default: portal
        options: [portal, studio, song, lab, score, tools]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:site
        env:
          SONARA_SITE_TARGET: ${{ inputs.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: sonara-${{ inputs.target }}
          path: build/site
          retention-days: 7
